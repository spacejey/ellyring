 <div class="auth-panel"><div class="section-tab" id="auth-tab">Log in</div><div class="card"><h2 id="auth-title">Welcome back.</h2><p id="auth-caption">Log in to your personal planner.</p><form id="auth-form"><label id="name-field" hidden>Your name<input name="name" type="text" autocomplete="name" maxlength="60"></label><label>Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label><label>Password<input name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128"></label><small id="password-hint" hidden>Use 10 or more characters.</small><p id="auth-error" role="alert"></p><button id="auth-submit" class="primary" type="submit">Log in</button></form><p class="auth-switch"><span id="auth-switch-label">New here?</span> <button id="auth-switch" type="button">Create an account</button></p><button id="continue-guest" class="guest-button" type="button">Continue as guest →</button><small class="guest-note">Guest plans stay in this browser.</small></div></div></div>
